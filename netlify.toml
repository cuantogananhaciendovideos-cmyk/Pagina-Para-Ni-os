# ClukyBook For Kids — configuración de despliegue en Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # El proyecto viene de AI Studio con un conflicto de versiones (Vite 8 / esbuild);
  # esta bandera permite que npm instale sin frenarse, igual que en la verificación local.
  NPM_FLAGS = "--legacy-peer-deps"
